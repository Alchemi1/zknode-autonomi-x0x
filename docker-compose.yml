services:
  # ── Katzenpost Post-Quantum Mixnet ──────────────────────────────
  mix-dirauth-1:
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    container_name: mix-dirauth-1
    entrypoint: ["sh", "-c"]
    command: ["while true; do /usr/local/bin/dirauth -f /var/lib/katzenpost/auth1/authority.toml; sleep 2; done"]
    volumes: ["./config/mixnet:/var/lib/katzenpost"]
    network_mode: host
    restart: unless-stopped
    mem_limit: ${MIXNET_MEM_LIMIT:-256m}
  mix-dirauth-2:
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    container_name: mix-dirauth-2
    entrypoint: ["sh", "-c"]
    command: ["while true; do /usr/local/bin/dirauth -f /var/lib/katzenpost/auth2/authority.toml; sleep 2; done"]
    volumes: ["./config/mixnet:/var/lib/katzenpost"]
    network_mode: host
    restart: unless-stopped
    mem_limit: ${MIXNET_MEM_LIMIT:-256m}
    depends_on: [mix-dirauth-1]
  mix-dirauth-3:
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    container_name: mix-dirauth-3
    entrypoint: ["sh", "-c"]
    command: ["while true; do /usr/local/bin/dirauth -f /var/lib/katzenpost/auth3/authority.toml; sleep 2; done"]
    volumes: ["./config/mixnet:/var/lib/katzenpost"]
    network_mode: host
    restart: unless-stopped
    mem_limit: ${MIXNET_MEM_LIMIT:-256m}
    depends_on: [mix-dirauth-2]
  mix-1:
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    container_name: mix-1
    command: ["/usr/local/bin/server", "-f", "/var/lib/katzenpost/mix1/katzenpost.toml"]
    volumes: ["./config/mixnet:/var/lib/katzenpost"]
    network_mode: host
    restart: unless-stopped
    mem_limit: ${MIXNET_MEM_LIMIT:-512m}
    depends_on: [mix-dirauth-1, mix-dirauth-2, mix-dirauth-3]
  mix-2:
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    container_name: mix-2
    command: ["/usr/local/bin/server", "-f", "/var/lib/katzenpost/mix2/katzenpost.toml"]
    volumes: ["./config/mixnet:/var/lib/katzenpost"]
    network_mode: host
    restart: unless-stopped
    mem_limit: ${MIXNET_MEM_LIMIT:-512m}
    depends_on: [mix-dirauth-1, mix-dirauth-2, mix-dirauth-3]
  mix-3:
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    container_name: mix-3
    command: ["/usr/local/bin/server", "-f", "/var/lib/katzenpost/mix3/katzenpost.toml"]
    volumes: ["./config/mixnet:/var/lib/katzenpost"]
    network_mode: host
    restart: unless-stopped
    mem_limit: ${MIXNET_MEM_LIMIT:-512m}
    depends_on: [mix-dirauth-1, mix-dirauth-2, mix-dirauth-3]
  mix-gateway:
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    container_name: mix-gateway
    command: ["/usr/local/bin/server", "-f", "/var/lib/katzenpost/gateway1/katzenpost.toml"]
    volumes: ["./config/mixnet:/var/lib/katzenpost"]
    network_mode: host
    restart: unless-stopped
    mem_limit: ${MIXNET_MEM_LIMIT:-256m}
    depends_on: [mix-1, mix-2, mix-3]
  mix-servicenode:
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    container_name: mix-servicenode
    entrypoint: ["/servicenode-entrypoint.sh"]
    volumes:
      - "./config/mixnet:/var/lib/katzenpost"
      - "./config/mixnet/servicenode-entrypoint.sh:/servicenode-entrypoint.sh:ro"
    network_mode: host
    restart: unless-stopped
    mem_limit: ${MIXNET_MEM_LIMIT:-256m}
    depends_on: [mix-1, mix-2, mix-3]
  mix-client:
    image: ${IMAGE_MIXNET:-zeros/mixnet-node:arm64}
    container_name: mix-client
    entrypoint: ["sh", "-c"]
    command: ["kpclientd -c /var/lib/katzenpost/client/client.toml & PID=$!; echo 'Waiting for PKI doc...'; for i in $(seq 1 60); do /usr/local/bin/fetch -f /var/lib/katzenpost/client/thinclient.toml && break; sleep 5; done; echo 'PKI doc available'; wait $PID"]
    volumes:
      - "./config/mixnet:/var/lib/katzenpost"
    network_mode: host
    restart: unless-stopped
    mem_limit: 128m
    depends_on: [mix-gateway]

  # ── SOCKS5 Mixnet Proxy ────────────────────────────────────────
  mixnet-proxy:
    image: ${IMAGE_MIXNET_PROXY:-zeros/mixnet-proxy:arm64}
    container_name: mixnet-proxy
    command: ["--config", "/etc/mixnet-proxy/config.json"]
    volumes:
      - "./config/proxy/config.json:/etc/mixnet-proxy/config.json:ro"
      - "./config/proxy/thinclient.toml:/etc/mixnet-proxy/thinclient.toml:ro"
    network_mode: host
    restart: unless-stopped
    mem_limit: ${PROXY_MEM_LIMIT:-128m}
    depends_on: [mix-client]

  # ── X0X Agent-to-Agent Network ────────────────────────────────
  x0xd:
    build:
      context: .
      dockerfile: Dockerfile.x0x
      args:
        TARGETARCH: ${TARGETARCH:-arm64}
        X0X_VERSION: ${X0X_VERSION:-0.34.3}
    image: ${IMAGE_X0X:-zknode-x0xd:latest}
    container_name: x0xd
    command: ["--config", "/etc/x0x/config.toml", "--data-dir", "/var/lib/x0x", "--api-port", "11700"]
    volumes:
      - "./config/x0x/config.toml:/etc/x0x/config.toml:ro"
      - "${X0X_DATA_DIR:-./data/x0x}:/var/lib/x0x"
    network_mode: host
    restart: unless-stopped
    mem_limit: ${X0X_MEM_LIMIT:-256m}
    depends_on: [mixnet-proxy]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:11700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── FAE AI Companion (requires binary from Saorsa Labs) ───────
  fae:
    build:
      context: .
      dockerfile: Dockerfile.fae
      args:
        TARGETARCH: ${TARGETARCH:-arm64}
    image: ${IMAGE_FAE:-zknode-fae:latest}
    container_name: fae
    command: ["--config", "/etc/fae/config.toml", "--data-dir", "/var/lib/fae"]
    volumes:
      - "./config/fae/config.toml:/etc/fae/config.toml:ro"
      - "${FAE_DATA_DIR:-./data/fae}:/var/lib/fae"
      - "./fae-skills:/var/lib/fae/skills:ro"
    network_mode: host
    restart: unless-stopped
    mem_limit: ${FAE_MEM_LIMIT:-512m}
    depends_on: [x0xd, llm-wiki]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:11780/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Walletshield (Ethereum RPC over Mixnet) ───────────────────
  walletshield:
    image: ${IMAGE_WALLETSHIELD:-zeros/walletshield:arm64}
    container_name: walletshield
    command: "-config /etc/walletshield/config.toml -listen 127.0.0.1:9200 -thin -log_level INFO"
    volumes:
      - "./config/walletshield/config.toml:/etc/walletshield/config.toml:ro"
      - "./data/walletshield:/var/lib/walletshield"
    network_mode: host
    restart: unless-stopped
    depends_on: [mix-client]

  # ── Storage Proving ──────────────────────────────────────────
  storage-proved-rs:
    image: ${IMAGE_STORAGE_PROVED:-zeros/storage-proved-rs:arm64}
    container_name: storage-proved-rs
    command: ["--listen", "0.0.0.0:9201", "--dir", "/var/lib/ant-node/chunks"]
    volumes: ["${AUTONOMI_CHUNK_DB:-./data/chunks}:/var/lib/ant-node/chunks:ro"]
    ports: ["127.0.0.1:9201:9201"]
    networks: [autonomi]
    restart: unless-stopped

  # ── antd (Autonomi Node Daemon) ─────────────────────────────
  antd:
    image: ${IMAGE_ANTD:-zeros/antd:arm64}
    container_name: antd
    cap_add: [SYS_ADMIN, SYS_RESOURCE]
    environment:
      - AUTONOMI_EVM_NETWORK=${AUTONOMI_EVM_NETWORK:-arbitrum-sepolia}
    volumes:
      - "./data/antd:/var/lib/antd"
      - "${AUTONOMI_CHUNK_DB:-./data/chunks}:/var/lib/ant-node/chunks"
      - "${AUTONOMI_LOGS_DIR:-./data/logs}:/var/lib/ant-node/logs"
    networks: [autonomi]
    entrypoint: ["sh", "-c"]
    command: ["echo 1 > /proc/sys/vm/overcommit_memory 2>/dev/null; tail -f /dev/null"]
    restart: unless-stopped

  # ── Mesh Networking ─────────────────────────────────────────
  reticulum:
    image: ${IMAGE_RETICULUM:-zeros/reticulum:arm64}
    container_name: reticulum
    command: ["--config", "/etc/reticulum/config"]
    volumes:
      - "./config/reticulum:/etc/reticulum"
      - "./data/reticulum:/var/lib/reticulum"
    network_mode: host
    restart: unless-stopped

  # ── Local LLM Wiki ──────────────────────────────────────────
  llm-wiki:
    image: ${IMAGE_LLM_WIKI:-zeros/llm-wiki:arm64}
    container_name: llm-wiki
    volumes:
      - "${WIKI_DATA_DIR:-./data/wikis}:/wikis"
      - "./config/llm-wiki:/etc/llm-wiki"
    network_mode: host
    restart: unless-stopped
    mem_limit: ${LLM_WIKI_MEM_LIMIT:-1g}

  # ── Dashboard ───────────────────────────────────────────────
  zknode-dashboard:
    build:
      context: ./zknode-dashboard
    image: ${IMAGE_DASHBOARD:-zknode-dashboard:latest}
    container_name: zknode-dashboard
    ports: ["${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "./zknode-dashboard/server/:/app/server/"
      - "./zknode-dashboard/public/:/app/public/"
      - "${ANT_CLI_PATH:-/usr/local/bin/ant}:/usr/local/bin/ant:ro"
      - "${ANT_DATA_DIR:-./data/ant}:/root/.local/share/ant:rw"
      - "${WIKI_DATA_DIR:-./data/wikis}:/wikis:ro"
      - "./data/nomadnet:/var/nomadnet:ro"
    environment:
      - PORT=${DASHBOARD_PORT:-8080}
      - X0X_API_PORT=${X0X_API_PORT:-11700}
      - FAE_API_PORT=${FAE_API_PORT:-11780}
      - WS_PORT=${WS_PORT:-9200}
      - LLM_WIKI_PORT=${LLM_WIKI_PORT:-18765}
    network_mode: host
    restart: unless-stopped
    depends_on: [mix-client, x0xd, antd]

networks:
  autonomi:
    driver: bridge
